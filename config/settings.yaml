project:
  name: modular-rag-mcp-server
  environment: local

llm:
  provider: openai
  model: gpt-4o-mini

embedding:
  provider: openai
  model: text-embedding-3-small

vector_store:
  provider: chroma
  persist_directory: data/db/chroma

retrieval:
  top_k: 5

rerank:
  enabled: false
  provider: none

evaluation:
  provider: custom

observability:
  traces_path: logs/traces.jsonl
  app_log_path: logs/app.log

ingestion:
  chunk_refiner:
    use_llm: false
    prompt_path: config/prompts/chunk_refinement.txt
  metadata_enricher:
    use_llm: false
  image_captioner:
    use_vision_llm: false
    prompt_path: config/prompts/image_captioning.txt
  dense_encoder:
    batch_size: 32
  sparse_encoder:
    k1: 1.5
    b: 0.75
    min_token_length: 2
    remove_stopwords: true
  batch_processor:
    batch_size: 32
    enable_dense: true
    enable_sparse: true
  bm25_indexer:
    index_dir: data/db/bm25
